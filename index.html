<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#dce9f6">
  <meta name="description" content="Wo ist das? - Sofies Adventskalender">
  <title>Wo ist das? - Sofies Adventskalender</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Libre+Franklin:wght@100..900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
</head>
<body>
  <main class="page">
    <header class="site-header">
      <h1>Wo ist das?</br>Sofies Adventskalender</h1>
    </header>

    <section class="calendar" aria-label="Adventskalender">
      <div class="calendar-grid" id="calendar" aria-live="polite"></div>
    </section>
  </main>

  <div class="modal-backdrop" id="modal-backdrop" hidden>
    <section class="photo-dialog" id="photo-dialog"
             role="dialog" aria-modal="true" aria-labelledby="dialog-title">
      <button class="close-button" id="close-button" type="button"
              aria-label="Foto schließen">×</button>
      <h2 class="visually-hidden" id="dialog-title">Türchen</h2>

      <div class="photo-area">
        <img id="quiz-image" src="" alt="Foto zum Erraten">
        <p class="image-fallback" id="image-fallback" hidden>
          Für dieses Türchen wurde noch kein Foto hinterlegt.
        </p>
      </div>

      <form class="answer-form" id="answer-form">
        <label class="visually-hidden" for="answer-input">Deine Antwort</label>
        <input id="answer-input" name="answer" type="text"
               placeholder="Wo ist das?" autocomplete="off"
               autocapitalize="sentences" required>
        <button class="submit-button" type="submit">Antwort überprüfen</button>
        <p class="feedback" id="feedback" role="status" aria-live="polite"></p>
      </form>
    </section>
  </div>
</body>
</html>
